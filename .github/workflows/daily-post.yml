# 2026-11-14 맥미니 launchd(com.aios.dandan50)로 이전 — 이 워크플로는 수동 예비용
name: Daily Blog Post Generation

on:
  workflow_dispatch:          # 수동 실행 가능

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate post
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POST_STATUS: draft   # 검수관(컨트롤타워)이 검수 후 공개
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLOG_ANTHROPIC_API_KEY: ${{ secrets.BLOG_ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 단단한 50
        run: npm run generate
